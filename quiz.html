<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Nextgen Edu Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body onload="loadQuiz()">
    <script>
        const user = localStorage.getItem("user");
        if (!user) { window.location = "login.html"; }
    </script>

    <!-- Top Navigation Bar -->
    <div class="nav-bar">
        <a href="dashboard.html" class="nav-logo">
            <span class="nav-logo-icon">NEC</span>
            <span class="nav-logo-text">NEXTGEN EDU</span>
        </a>
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <span id="welcome" style="font-weight: 700; color: var(--secondary); font-size: 14px;"></span>
            <button onclick="logout()" class="btn btn-outline" style="padding: 8px 16px; font-size: 13px;">Logout</button>
        </div>
    </div>

    <!-- Hero / Dashboard Banner -->
    <div class="hero-banner" style="padding: 40px max(24px, calc((100% - 1200px) / 2));">
        <div class="hero-content">
            <span class="hero-tag" style="color: var(--accent);">TEST YOUR KNOWLEDGE</span>
            <h1 class="hero-title" style="font-size: 2.8rem; line-height: 1;">COURSE EXAMINATION</h1>
            <p class="hero-desc" style="margin-bottom: 0;">Complete this quiz to test your understanding. You need to answer 2 or more questions correctly to pass and receive your completion certificate.</p>
        </div>
    </div>

    <div class="geom-divider"></div>

    <!-- Main Section -->
    <div class="main-content">
        <div class="quiz-box" style="background: #FFFFFF; box-shadow: var(--card-shadow); padding: 40px; border-top: 5px solid var(--primary); max-width: 800px; margin: 0 auto;">
            <form id="quizForm" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px;"></form>
            <div style="text-align: center; display: flex; justify-content: center; gap: 16px;">
                <button onclick="submitQuiz()" type="button" class="btn btn-primary" style="min-width: 180px;">Submit Quiz</button>
                <button onclick="window.history.back()" class="btn btn-outline" style="min-width: 150px;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById("welcome").innerText = "Logged in as: " + user;
        lucide.createIcons();
    </script>
</body>
</html>
