<!DOCTYPE html>
<html>
<head>
<title>Certificate - Nextgen Edu Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body { 
    font-family: 'Inter', sans-serif; 
    background: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 50%, #f8fafc 100%); 
    display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
}
.certificate-wrapper { 
    background: rgba(255,255,255,0.75); padding: 20px; 
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05); border-radius: 16px; 
    backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.8);
}
.certificate {
    width: 800px; padding: 60px 40px; text-align: center; background: white;
    border: 12px solid #0f172a; position: relative; border-radius: 8px;
}
.certificate::before {
    content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 2px solid #d4af37; pointer-events: none;
}
.cert-header { font-family: 'Playfair Display', serif; font-size: 48px; color: #0f172a; margin-bottom: 24px; font-weight: 700; letter-spacing: 1px; }
.cert-subheader { font-size: 16px; color: #64748b; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 40px; }
.cert-awarded-to { font-family: 'Playfair Display', serif; font-size: 24px; font-style: italic; color: #334155; margin-bottom: 24px; }
.student-name { font-family: 'Playfair Display', serif; font-size: 56px; color: #3B82F6; margin: 0 0 32px 0; font-weight: 700; border-bottom: 2px solid #e2e8f0; display: inline-block; padding: 0 40px 10px; }
.cert-footer { font-size: 18px; color: #475569; font-weight: 500; max-width: 500px; margin: 0 auto; line-height: 1.6; }
.badge { position: absolute; bottom: 40px; right: 50px; width: 100px; height: 100px; background: #d4af37; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-family: 'Playfair Display', serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.badge::after { content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; border: 2px dashed rgba(255,255,255,0.5); border-radius: 50%; }
.print-btn { position: absolute; top: -60px; right: 0; padding: 12px 24px; background: linear-gradient(135deg, #3B82F6 0%, #6366F1 100%); color: white; border: none; border-radius: 10px; cursor: pointer; font-family: 'Inter'; font-weight: 600; font-size: 14px; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3); transition: all 0.3s ease; }
.print-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
@media print { body { background: white; } .certificate-wrapper { box-shadow: none; padding: 0; } .print-btn { display: none; } }
</style>
</head>
<body>
<div class="certificate-wrapper" style="position: relative;">
    <button class="print-btn" onclick="window.print()">Print Certificate</button>
    <div class="certificate">
        <div class="cert-header">Certificate of Completion</div>
        <div class="cert-subheader">Nextgen Edu Connect</div>
        <div class="cert-awarded-to">This certificate is proudly awarded to</div>
        <h1 id="studentName" class="student-name"></h1>
        <div class="cert-footer">For successfully completing the course curriculum and demonstrating exceptional dedication to continuous learning.</div>
        <div class="badge">NEC<br>CERTIFIED</div>
    </div>
</div>
<script>
document.getElementById("studentName").innerHTML = localStorage.getItem("user") || "Student Name";
</script>
</body>
</html>
