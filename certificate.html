<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate - Nextgen Edu Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B00;
            --primary-hover: #E05E00;
            --secondary: #0A1F5C;
            --secondary-light: #152C73;
            --accent: #FF9A3C;
            --bg-light: #F8F9FF;
            --text-dark: #0A1F5C;
            --text-light: #FFFFFF;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, var(--secondary) 0%, #06133A 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: ''; position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .certificate-wrapper { 
            background: #FFFFFF; 
            padding: 24px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); 
            border-radius: 4px; 
            border-top: 8px solid var(--primary);
            position: relative;
            z-index: 10;
        }

        .certificate {
            width: 820px; 
            padding: 60px 50px; 
            text-align: center; 
            background: white;
            border: 12px solid var(--secondary); 
            position: relative;
            border-radius: 2px;
        }

        /* Inner border accent */
        .certificate::before {
            content: ''; 
            position: absolute; 
            top: 8px; 
            left: 8px; 
            right: 8px; 
            bottom: 8px;
            border: 2px solid var(--primary); 
            pointer-events: none;
        }

        .cert-header { 
            font-family: 'Barlow Condensed', sans-serif; 
            font-weight: 800;
            font-size: 42px; 
            color: var(--secondary); 
            margin-bottom: 8px; 
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .cert-subheader { 
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 15px; 
            color: var(--primary); 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin-bottom: 40px; 
        }

        .cert-awarded-to { 
            font-family: 'Playfair Display', serif; 
            font-size: 20px; 
            font-style: italic; 
            color: var(--text-dark); 
            margin-bottom: 20px; 
        }

        .student-name { 
            font-family: 'Barlow Condensed', sans-serif; 
            font-size: 52px; 
            color: var(--secondary); 
            margin: 0 auto 32px; 
            font-weight: 800; 
            border-bottom: 3px solid var(--primary); 
            display: inline-block; 
            padding: 0 40px 8px; 
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .cert-footer { 
            font-size: 15px; 
            color: var(--text-dark); 
            font-weight: 500; 
            max-width: 540px; 
            margin: 0 auto; 
            line-height: 1.7; 
        }

        .badge-cert { 
            position: absolute; 
            bottom: 40px; 
            right: 50px; 
            width: 110px; 
            height: 110px; 
            background: var(--primary); 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: white; 
            font-weight: 800; 
            font-size: 12px;
            font-family: 'Barlow Condensed', sans-serif; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 15px rgba(255, 107, 0, 0.35); 
            text-align: center;
            border: 2px dashed rgba(255,255,255,0.4);
            transform: rotate(-10deg);
        }

        .badge-cert::after { 
            content: ''; 
            position: absolute; 
            top: -4px; 
            left: -4px; 
            right: -4px; 
            bottom: -4px; 
            border: 2px solid var(--secondary); 
            border-radius: 50%; 
        }

        .print-btn { 
            position: absolute; 
            top: -64px; 
            right: 0; 
            padding: 12px 28px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-family: 'Barlow Condensed', sans-serif; 
            font-weight: 800; 
            font-size: 16px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 4px 4px 0px var(--secondary); 
            transition: all 0.25s ease; 
        }

        .print-btn:hover { 
            background-color: var(--primary-hover);
            transform: translate(-2px, -2px); 
            box-shadow: 6px 6px 0px var(--secondary); 
        }
        
        .print-btn:active {
            transform: translate(0, 0);
            box-shadow: 4px 4px 0px var(--secondary);
        }

        .back-btn {
            position: absolute;
            top: -64px;
            left: 0;
            padding: 12px 24px;
            background: transparent;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background-color: white;
            color: var(--secondary);
        }

        @media print { 
            body { background: white; padding: 0; } 
            .certificate-wrapper { box-shadow: none; padding: 0; border-top: none; } 
            .print-btn, .back-btn { display: none; } 
        }

        @media (max-width: 900px) {
            .certificate {
                width: 100%;
                max-width: 820px;
                padding: 40px 20px;
            }
            .cert-header { font-size: 32px; }
            .student-name { font-size: 36px; padding: 0 20px 4px; }
            .badge-cert { display: none; }
        }
    </style>
</head>
<body>
    <div class="certificate-wrapper">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
        <button class="print-btn" onclick="window.print()">Print Certificate</button>
        <div class="certificate">
            <div class="cert-header">Certificate of Completion</div>
            <div class="cert-subheader">Nextgen Edu Connect</div>
            <div class="cert-awarded-to">This certificate is proudly awarded to</div>
            <h1 id="studentName" class="student-name">Student Name</h1>
            <div class="cert-footer">For successfully completing the course curriculum and demonstrating exceptional dedication to continuous learning.</div>
            <div class="badge-cert">NEC<br>CERTIFIED</div>
        </div>
    </div>
    <script>
        document.getElementById("studentName").innerHTML = localStorage.getItem("user") || "Student Name";
    </script>
</body>
</html>
